# Pipeline de integración y despliegue continuo del sitio NimbusCR.
# Cada push a la rama main compila el sitio y lo publica en Netlify (producción).
# También se puede ejecutar a mano desde Actions > CI/CD NimbusCR > Run workflow.
#
# Requiere en Settings > Secrets and variables > Actions:
#   Secrets:   NETLIFY_AUTH_TOKEN (token personal de Netlify)
#              NETLIFY_SITE_ID    (Project ID del proyecto en Netlify)
#   Variables: SITE_URL           (URL pública del sitio, con https://)

name: CI/CD NimbusCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca corren dos despliegues a producción al mismo tiempo.
concurrency:
  group: produccion
  cancel-in-progress: false

env:
  NETLIFY_CLI_VERSION: 27.20.1

jobs:
  desplegar:
    name: Compilar, desplegar y verificar
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.SITE_URL }}

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio (HTML + Tailwind CSS)
        run: npm run build

      - name: Desplegar en Netlify (producción)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy \
            --dir=dist \
            --prod \
            --no-build \
            --site="${NETLIFY_SITE_ID}" \
            --message="Commit ${GITHUB_SHA::7}, ejecución ${GITHUB_RUN_NUMBER}"

      - name: Verificar disponibilidad y cabeceras de seguridad
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "Verificando ${SITE_URL}"
          sleep 5
          cabeceras=$(curl -sSIL --retry 3 --retry-delay 5 "${SITE_URL}")
          echo "${cabeceras}"

          estado=$(curl -s -o /dev/null -w '%{http_code}' -L "${SITE_URL}")
          if [ "${estado}" != "200" ]; then
            echo "::error::El sitio respondió con el código ${estado}"
            exit 1
          fi

          {
            echo "## Despliegue verificado"
            echo ""
            echo "- URL: ${SITE_URL}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Código HTTP: ${estado}"
            echo ""
            echo "| Cabecera de seguridad | Estado |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for cabecera in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy permissions-policy; do
            if echo "${cabeceras}" | grep -qi "^${cabecera}:"; then
              echo "OK ${cabecera}"
              echo "| \`${cabecera}\` | presente |" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::error::Falta la cabecera ${cabecera}"
              echo "| \`${cabecera}\` | falta |" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
          done
